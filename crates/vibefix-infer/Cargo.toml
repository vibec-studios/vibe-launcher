[package]
name = "vibefix-infer"
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
license = "Apache-2.0"
description = "Reine Rust-Inferenz für VibeFix-Net"
publish = false
workspace = "../../src-tauri"

[lib]
name = "vibefix_infer"
path = "src/lib.rs"

[[bin]]
name = "vibefix-infer"
path = "src/bin/vibefix-infer.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
sha2 = "0.10"
thiserror = "2"
flate2 = "1"
unicode-normalization = "0.1"
fancy-regex = "0.14"
toml = "0.8"

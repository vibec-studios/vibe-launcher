# Beide ersetzen dieselbe Fadenkreuz-Darstellung (@Redirect auf InGameHud) – Absturz beim Start.
[[pair]]
id = "centeredcrosshair-vibey"
a = { name = "Centered Crosshair", ids = ["centeredcrosshair", "centered-crosshair", "centered_crosshair"], file = '(?i)^centered[-_ ]?crosshair[^/]*\.jar$' }
b = { name = "Vibey Client", ids = ["vibeyclient", "vibey", "vibey-client"], file = '(?i)^vibey-?client[^/]*\.jar$', version = "0.3.0" }
source = "Absturzbericht Vibey Client 0.3.0 (Mixin-Konflikt beim Start)"

# Bekannte unverträgliche Mod-Paare. „Probleme beheben“ bietet an, eine der beiden Mods zu deaktivieren (nur nach
# Rückfrage). Bitte nur Paare mit belastbarer Quelle eintragen.
#
# Je Seite (a/b): `ids` (Mod-IDs aus fabric.mod.json/mods.toml), optional `file` (Regex auf den Dateinamen, für Mods
# ohne Metadaten wie OptiFine) und `version` (Präfix der Mod-Version, z. B. nur eine bestimmte Version betroffen).
# Vorgeschlagen wird, Seite `a` zu deaktivieren; Seite `b` ist die Alternative.

[[pair]]
id = "optifine-sodium"
a = { name = "OptiFine", ids = ["optifabric", "optifine"], file = '(?i)^(optifine|optifabric)[^/]*\.jar$' }
b = { name = "Sodium", ids = ["sodium"] }
source = "https://github.com/CaffeineMC/sodium (fabric.mod.json: breaks optifabric)"


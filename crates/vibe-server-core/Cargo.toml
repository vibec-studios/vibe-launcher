[package]
name = "vibe-server-core"
version = "0.1.0"
license = "Apache-2.0"
description = "Gemeinsame Minecraft-Server-Logik von Vibe Launcher und Vibe Server Agent"
edition = "2021"
rust-version = "1.80"
workspace = "../../src-tauri"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
futures = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream", "gzip", "brotli", "deflate", "multipart"] }
thiserror = "2"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
sha1 = "0.10"
sha2 = "0.10"
hex = "0.4"
zip = { version = "2", default-features = false, features = ["deflate"] }
flate2 = "1"
dirs = "6"
parking_lot = "0.12"
tracing = "0.1"
regex = "1"
url = "2"
walkdir = "2"
base64 = "0.22"
urlencoding = "2"
bytes = "1"
semver = "1"
toml = "0.8"
md-5 = "0.10"
sysinfo = { version = "0.33", default-features = false, features = ["system", "disk"] }
trash = "5"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Threading"] }

[package]
name = "vibe-launcher"
version = "1.0.0-beta.8"
license = "Apache-2.0"
description = "Vibe Launcher - Minecraft launcher by Vibe Craft Studios"
authors = ["Vibe Craft Studios"]
edition = "2021"
rust-version = "1.80"

[workspace]
members = [".", "../crates/vibe-server-core", "../crates/vibefix-infer", "../agent"]
resolver = "2"

[lib]
name = "vibe_launcher_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
vibe-server-core = { path = "../crates/vibe-server-core" }
vibefix-infer = { path = "../crates/vibefix-infer" }
ring = "0.17"
tauri = { version = "2", features = ["protocol-asset", "image-png", "tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-process = "2"
tauri-plugin-updater = "2"
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
tauri-plugin-deep-link = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
futures = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream", "gzip", "brotli", "deflate", "multipart"] }
thiserror = "2"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
sha1 = "0.10"
sha2 = "0.10"
hex = "0.4"
zip = { version = "2", default-features = false, features = ["deflate"] }
flate2 = "1"
dirs = "6"
parking_lot = "0.12"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
tracing-appender = "0.2"
regex = "1"
url = "2"
walkdir = "2"
toml = "0.8"
base64 = "0.22"
sysinfo = { version = "0.33", default-features = false, features = ["system", "disk"] }
keyring = { version = "3", features = ["windows-native", "apple-native", "linux-native"] }
md-5 = "0.10"
urlencoding = "2"
bytes = "1"
semver = "1"
rusqlite = { version = "0.31", features = ["bundled"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "ico"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio-tungstenite = { version = "0.26", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }
trash = "5"

[profile.dev.package."*"]
opt-level = 2

[profile.dev.package.vibefix-infer]
opt-level = 3

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
strip = true

[target.'cfg(windows)'.dependencies]
webview2-com = "0.39"
windows-core = "0.62"
# Großes Fenster-Icon (Taskleiste) setzen – Tauri setzt nur das kleine
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_UI_HiDpi", "Win32_System_Registry", "Win32_Storage_FileSystem", "Win32_Graphics_Gdi", "Win32_Storage_Xps", "Win32_Globalization"] }

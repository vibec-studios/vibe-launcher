[package]
name = "vibe-agent"
version = "0.1.1"
license = "Apache-2.0"
description = "Vibe Server Agent – verwaltet Minecraft-Server auf diesem Rechner"
edition = "2021"
rust-version = "1.80"
workspace = "../src-tauri"
build = "build.rs"

[[bin]]
name = "vibe-agent"
path = "src/main.rs"

[dependencies]
vibe-server-core = { path = "../crates/vibe-server-core" }
axum = { version = "0.8", default-features = false, features = ["http1", "json", "query", "tokio", "ws"] }
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["server", "server-auto", "tokio", "service"] }
tower = { version = "0.5", features = ["util"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rcgen = { version = "0.13", default-features = false, features = ["ring", "pem"] }
tokio-tungstenite = { version = "0.26", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
futures = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
sha1 = "0.10"
ring = "0.17"
sha2 = "0.10"
hex = "0.4"
base64 = "0.22"
uuid = { version = "1", features = ["v4"] }
chrono = "0.4"
parking_lot = "0.12"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
tracing-appender = "0.2"
toml = "0.8"
zip = { version = "2", default-features = false, features = ["deflate"] }
sysinfo = { version = "0.33", default-features = false, features = ["system", "disk"] }
mime_guess = "2"
url = "2"
urlencoding = "2"
bytes = "1"
semver = "1"
walkdir = "2"



[target.'cfg(windows)'.dependencies]
windows-service = "0.8"

[dev-dependencies]

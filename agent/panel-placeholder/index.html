<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vibe Panel</title>
<style>
:root{--bg:#0f1115;--fg:#e8eaf0;--mute:#9aa3b2;--card:#181b22;--acc:#7c5cff}
@media (prefers-color-scheme: light){:root{--bg:#f6f7fb;--fg:#14161c;--mute:#5b6372;--card:#fff}}
body{margin:0;font:15px/1.5 system-ui,sans-serif;background:var(--bg);color:var(--fg);display:grid;place-items:center;min-height:100vh;padding:16px;box-sizing:border-box}
main{background:var(--card);border-radius:14px;padding:28px;max-width:460px;width:100%;box-shadow:0 8px 30px #0003}
h1{margin:0 0 8px;font-size:22px}p{color:var(--mute);margin:8px 0}code{background:#0002;padding:2px 6px;border-radius:6px}
</style>
</head>
<body>
<main>
<h1>Vibe Server Agent</h1>
<p>Der Agent läuft. Das Vibe Panel wird hier eingebettet, sobald es gebaut ist.</p>
<p>Verbinde dich bis dahin aus dem Vibe Launcher mit Adresse und Kopplungscode (<code>vibe-agent pair</code>).</p>
</main>
</body>
</html>

name: AFK-Helfer

# Eigenständiger Java-Agent für den AFK-Modus (tools/afk-agent, docs/AFK-AGENT.md).
# Änderungen unter tools/afk-agent -> Tests. Tag afk-agent-v<version> -> GitHub-Release "Vibe AFK Agent <version>"
# mit genau zwei Dateien:
#   vibe-afk-agent-<version>.jar          das -javaagent-Jar (Java-8-Bytecode, ASM eingebettet)
#   vibe-afk-agent-<version>.jar.sha256   "<sha256>  vibe-afk-agent-<version>.jar"
# Das Release ist nie "Latest" (das bleibt das Launcher-Release v*), kein Vorab-Release, kein Entwurf.
# release.yml (v*), agent-release.yml (agent-v*) und dev.yml reagieren nicht darauf, das Download-Center ignoriert
# afk-agent-v* (Tag-Filter des Projekts vibe-launcher im Backend).
# Der Launcher pinnt Version + SHA-256 in src-tauri/src/afk/agent.rs und lädt das Jar bei Bedarf.
#
# Neue Version: agent_version in tools/afk-agent/gradle.properties erhöhen, nach main mergen, dann
#   git tag afk-agent-v<version> && git push origin afk-agent-v<version>
# Erneut ausführen (oder workflow_dispatch mit dem Tag) ist sicher: Dateien werden ersetzt (--clobber).

on:
  push:
    tags: ["afk-agent-v*"]
    branches: ["**"]
    paths: ["tools/afk-agent/**", ".github/workflows/afk-agent.yml"]
  pull_request:
    paths: ["tools/afk-agent/**", ".github/workflows/afk-agent.yml"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag, der (erneut) veröffentlicht wird (z. B. afk-agent-v0.1.1); leer = nur testen"
        required: false

concurrency:
  group: afk-agent-${{ inputs.tag || github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  test:
    name: Testen
    if: ${{ !startsWith(inputs.tag || github.ref_name, 'afk-agent-v') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: tools/afk-agent
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
          cache-dependency-path: |
            tools/afk-agent/*.gradle
            tools/afk-agent/gradle/wrapper/gradle-wrapper.properties

      - name: Testen und bauen
        run: ./gradlew --no-daemon test shadowJar sha256

      - name: Hash anzeigen
        run: cat build/libs/*.sha256

  release:
    name: Testen und veröffentlichen
    if: ${{ startsWith(inputs.tag || github.ref_name, 'afk-agent-v') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    defaults:
      run:
        working-directory: tools/afk-agent
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Tag mit agent_version vergleichen
        run: |
          VERSION="$(grep '^agent_version=' gradle.properties | cut -d= -f2 | tr -d '\r')"
          if [ "afk-agent-v$VERSION" != "$TAG" ]; then
            echo "Tag $TAG passt nicht zu agent_version=$VERSION" >&2
            exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Testen und bauen
        run: ./gradlew --no-daemon test shadowJar sha256

      - name: GitHub-Release anlegen oder aktualisieren
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd build/libs
          JAR="vibe-afk-agent-$VERSION.jar"
          test -f "$JAR" && test -f "$JAR.sha256"
          cat "$JAR.sha256"
          sha256sum -c "$JAR.sha256"
          title="Vibe AFK Agent $VERSION"
          notes="Java-Agent für den AFK-Modus des Vibe Launchers (Fenster ausblenden, 2 FPS, Ton aus, Chat/Ereignisse). SHA-256: $(cut -d' ' -f1 "$JAR.sha256")"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$JAR" "$JAR.sha256" --clobber
            gh release edit "$TAG" --title "$title" --notes "$notes" --latest=false --prerelease=false --draft=false
          else
            gh release create "$TAG" "$JAR" "$JAR.sha256" --verify-tag --title "$title" --notes "$notes" --latest=false
          fi

name: CI

# Prüft jeden Push und jeden Pull Request: Typecheck, Frontend-Build, cargo check + test.
on:
  push:
    branches: ["**"]
    tags-ignore: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  runner:
    uses: ./.github/workflows/pick-runner.yml

  check:
    needs: runner
    name: Typecheck, Build, Tests
    runs-on: ${{ needs.runner.outputs.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup
        with:
          cache-key: debug

      - name: Typecheck
        run: pnpm typecheck

      # Richtwert 300 Zeilen je Code-Datei: neue oder gewachsene große Dateien als Warnung (blockiert nicht)
      - name: Dateigrößen
        continue-on-error: true
        run: node scripts/check-size.mjs --check --warn-only

      # Muss vor cargo laufen: tauri::generate_context! erwartet ../dist
      - name: Frontend-Build
        run: pnpm build

      - name: cargo check
        working-directory: src-tauri
        run: cargo check --locked --all-targets

      - name: cargo test
        working-directory: src-tauri
        run: cargo test --locked

name: CI

# Prüft jeden Push und jeden Pull Request: Typecheck, Frontend-Build, cargo check + test.
on:
  push:
    branches: ["**"]
    tags-ignore: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck, Build, Tests
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup
        with:
          cache-key: debug

      - name: Typecheck
        run: pnpm typecheck

      # Muss vor cargo laufen: tauri::generate_context! erwartet ../dist
      - name: Frontend-Build
        run: pnpm build

      - name: cargo check
        working-directory: src-tauri
        run: cargo check --locked --all-targets

      - name: cargo test
        working-directory: src-tauri
        run: cargo test --locked

name: Release

# Neues Release (Kanal "Release"):
#   1. Version in package.json + src-tauri/Cargo.toml erhöhen (node scripts/set-version.mjs X.Y.Z), committen
#   2. Tag vX.Y.Z pushen
# Ergebnis: veröffentlichtes GitHub-Release mit Installern für Windows (NSIS), Linux (AppImage, .deb) und
# macOS (dmg, universal), .sig-Dateien und einer gemeinsamen latest.json für den Updater.
# Launcher im Kanal "Release" laden es über .../releases/latest/download/latest.json
on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  actions: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    name: Tag & Secrets prüfen
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Tag passt zur Version?
        id: ver
        shell: bash
        run: |
          pkg=$(node -p "require('./package.json').version")
          cargo_ver=$(grep -m1 '^version' src-tauri/Cargo.toml | sed -E 's/.*"(.*)".*/\1/')
          tag="${GITHUB_REF_NAME#v}"
          echo "Tag: $tag, package.json: $pkg, Cargo.toml: $cargo_ver"
          if [ "$tag" != "$pkg" ] || [ "$tag" != "$cargo_ver" ]; then
            echo "::error::Tag v$tag passt nicht zu package.json ($pkg) / Cargo.toml ($cargo_ver)"
            exit 1
          fi
          echo "version=$tag" >> "$GITHUB_OUTPUT"

      - name: Secrets vorhanden?
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          CURSEFORGE_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}
          VIBE_MSA_CLIENT_ID: ${{ secrets.VIBE_MSA_CLIENT_ID }}
          VIBE_DISCORD_CLIENT_ID: ${{ vars.VIBE_DISCORD_CLIENT_ID }}
        run: |
          [ -n "$TAURI_SIGNING_PRIVATE_KEY" ] || { echo "::error::Secret TAURI_SIGNING_PRIVATE_KEY fehlt"; exit 1; }
          [ -n "$CURSEFORGE_API_KEY" ] || echo "::warning::CURSEFORGE_API_KEY fehlt – CurseForge ist im Build deaktiviert"
          [ -n "$VIBE_MSA_CLIENT_ID" ] || echo "::warning::VIBE_MSA_CLIENT_ID fehlt – Microsoft-Login ist im Build deaktiviert"
          [ -n "$VIBE_DISCORD_CLIENT_ID" ] || echo "::warning::Repo-Variable VIBE_DISCORD_CLIENT_ID fehlt – Discord-Status ist im Build deaktiviert"

  runner:
    uses: ./.github/workflows/pick-runner.yml

  plan:
    name: Plattformen wählen
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.p.outputs.matrix }}
      platforms: ${{ steps.p.outputs.platforms }}
    steps:
      - id: p
        name: Plattformen aus Repo-Variable BUILD_PLATFORMS (Standard windows)
        env:
          WANT: ${{ vars.BUILD_PLATFORMS || 'windows' }}
        run: |
          all='[{"platform":"windows","bundles":"nsis","args":"","targets":""},{"platform":"linux","bundles":"appimage,deb","args":"","targets":""},{"platform":"macos","bundles":"app,dmg","args":"--target universal-apple-darwin","targets":"aarch64-apple-darwin,x86_64-apple-darwin"}]'
          want=$(printf '%s' "$WANT" | tr -d ' ')
          matrix=$(jq -c --arg w "$want" '($w | split(",")) as $ws | {include: [.[] | select(.platform as $p | $ws | index($p))]}' <<<"$all")
          [ "$(jq '.include | length' <<<"$matrix")" -gt 0 ] || { echo "::error::BUILD_PLATFORMS ohne gültige Plattform: $WANT"; exit 1; }
          platforms=$(jq -r '[.include[].platform] | join(",")' <<<"$matrix")
          echo "Baue: $platforms"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          echo "platforms=$platforms" >> "$GITHUB_OUTPUT"

  build:
    needs: [check, runner, plan]
    name: Release ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ${{ matrix.platform == 'windows' && needs.runner.outputs.runner || (matrix.platform == 'linux' && needs.runner.outputs.linux || needs.runner.outputs.macos) }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup
        with:
          cache-key: release-${{ matrix.platform }}
          rust-targets: ${{ matrix.targets }}

      - name: Build (${{ matrix.bundles }}, signiert)
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          CURSEFORGE_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}
          VIBE_MSA_CLIENT_ID: ${{ secrets.VIBE_MSA_CLIENT_ID }}
          VIBE_DISCORD_CLIENT_ID: ${{ vars.VIBE_DISCORD_CLIENT_ID }}
          VIBE_UPDATE_CHANNEL: release
        run: pnpm tauri build --bundles ${{ matrix.bundles }} ${{ matrix.args }}

      - uses: actions/upload-artifact@v4
        with:
          name: bundle-${{ matrix.platform }}
          if-no-files-found: error
          retention-days: 7
          path: |
            src-tauri/target/**/release/bundle/nsis/*-setup.exe*
            src-tauri/target/**/release/bundle/appimage/*.AppImage*
            src-tauri/target/**/release/bundle/deb/*.deb
            src-tauri/target/**/release/bundle/dmg/*.dmg
            src-tauri/target/**/release/bundle/macos/*.app.tar.gz*

  publish:
    needs: [check, plan, build]
    name: GitHub-Release veröffentlichen
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - uses: actions/download-artifact@v4
        with:
          pattern: bundle-*
          path: artifacts

      - name: Release-Dateien + latest.json (alle Plattformen)
        run: |
          node scripts/prepare-release.mjs --tag "$GITHUB_REF_NAME" --version "${{ needs.check.outputs.version }}" --from artifacts \
            --require ${{ needs.plan.outputs.platforms }} --notes "Vibe Launcher ${{ needs.check.outputs.version }}"

      - name: GitHub-Release veröffentlichen
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" release-files/* \
            --title "Vibe Launcher ${{ needs.check.outputs.version }}" \
            --generate-notes \
            --latest

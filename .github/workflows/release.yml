name: Release

# Neues Release (Kanal "Release"):
#   1. Version in package.json + src-tauri/Cargo.toml erhöhen (node scripts/set-version.mjs X.Y.Z), committen
#   2. Tag vX.Y.Z pushen
# Ergebnis: veröffentlichtes GitHub-Release mit Installer, .sig und latest.json.
# Launcher im Kanal "Release" laden es über .../releases/latest/download/latest.json
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Windows-Release
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Tag passt zur Version?
        id: ver
        shell: bash
        run: |
          pkg=$(node -p "require('./package.json').version")
          cargo_ver=$(grep -m1 '^version' src-tauri/Cargo.toml | sed -E 's/.*"(.*)".*/\1/')
          tag="${GITHUB_REF_NAME#v}"
          echo "Tag: $tag, package.json: $pkg, Cargo.toml: $cargo_ver"
          if [ "$tag" != "$pkg" ] || [ "$tag" != "$cargo_ver" ]; then
            echo "::error::Tag v$tag passt nicht zu package.json ($pkg) / Cargo.toml ($cargo_ver)"
            exit 1
          fi
          echo "version=$tag" >> "$GITHUB_OUTPUT"

      - name: Secrets vorhanden?
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          CURSEFORGE_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}
          VIBE_MSA_CLIENT_ID: ${{ secrets.VIBE_MSA_CLIENT_ID }}
        run: |
          [ -n "$TAURI_SIGNING_PRIVATE_KEY" ] || { echo "::error::Secret TAURI_SIGNING_PRIVATE_KEY fehlt"; exit 1; }
          [ -n "$CURSEFORGE_API_KEY" ] || echo "::warning::CURSEFORGE_API_KEY fehlt – CurseForge ist im Build deaktiviert"
          [ -n "$VIBE_MSA_CLIENT_ID" ] || echo "::warning::VIBE_MSA_CLIENT_ID fehlt – Microsoft-Login ist im Build deaktiviert"

      - uses: ./.github/actions/setup
        with:
          cache-key: release

      - name: Build (NSIS, signiert)
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          CURSEFORGE_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}
          VIBE_MSA_CLIENT_ID: ${{ secrets.VIBE_MSA_CLIENT_ID }}
          VIBE_UPDATE_CHANNEL: release
        run: pnpm tauri build --bundles nsis

      - name: Release-Dateien + latest.json
        shell: bash
        run: node scripts/prepare-release.mjs --tag "$GITHUB_REF_NAME" --version "${{ steps.ver.outputs.version }}" --notes "Vibe Launcher ${{ steps.ver.outputs.version }}"

      - name: GitHub-Release veröffentlichen
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" release-files/* \
            --title "Vibe Launcher ${{ steps.ver.outputs.version }}" \
            --generate-notes \
            --latest

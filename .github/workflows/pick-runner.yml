name: Runner wählen

# Wiederverwendbar: liefert die Runner für Builds (Windows, Linux, macOS).
# Blacksmith nur solange das Freikontingent reicht, sonst kostenloser GitHub-Runner (siehe scripts/pick-runner.mjs).
# macOS läuft immer auf dem kostenlosen GitHub-Runner.
# Fest überschreiben: Repo-Variablen WINDOWS_RUNNER, LINUX_RUNNER, MACOS_RUNNER (z. B. "windows-latest").
on:
  workflow_call:
    outputs:
      runner:
        description: Windows-Runner-Label
        value: ${{ jobs.pick.outputs.runner }}
      linux:
        description: Linux-Runner-Label
        value: ${{ jobs.pick.outputs.linux }}
      macos:
        description: macOS-Runner-Label
        value: ${{ jobs.pick.outputs.macos }}

permissions:
  actions: read
  contents: read

jobs:
  pick:
    name: Runner wählen
    # Kostenlos für öffentliche Repos
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      runner: ${{ steps.pick.outputs.runner }}
      linux: ${{ steps.pick.outputs.linux }}
      macos: ${{ steps.pick.outputs.macos }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: scripts
      - id: pick
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FORCE_RUNNER: ${{ vars.WINDOWS_RUNNER }}
          FORCE_LINUX_RUNNER: ${{ vars.LINUX_RUNNER }}
          FORCE_MACOS_RUNNER: ${{ vars.MACOS_RUNNER }}
        run: node scripts/pick-runner.mjs all

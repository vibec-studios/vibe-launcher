name: Setup
description: Node/pnpm, Rust und alle Caches (pnpm-Store, Cargo, Tauri-Bundler-Tools) einrichten
inputs:
  cache-key:
    description: Cargo-Cache-Schlüssel (getrennt nach Profil, z. B. "release" oder "debug")
    required: true
runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@v4
      with:
        version: 11

    - uses: actions/setup-node@v4
      with:
        node-version: 24
        cache: pnpm

    - uses: dtolnay/rust-toolchain@stable

    # target/ + ~/.cargo (Registry, Git) – nur main/Tags speichern, Branches lesen nur
    - uses: Swatinem/rust-cache@v2
      with:
        workspaces: src-tauri -> target
        shared-key: ${{ inputs.cache-key }}
        save-if: ${{ github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/') }}
        # Auch bei Fehlschlag speichern – sonst kostet ein Fehler im letzten Schritt wieder den vollen Build
        cache-on-failure: true

    # NSIS + Signier-Tools, die die Tauri-CLI beim ersten Bundle herunterlädt
    - uses: actions/cache@v4
      with:
        path: ~\AppData\Local\tauri
        key: tauri-bundler-tools-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
        restore-keys: tauri-bundler-tools-${{ runner.os }}-

    - name: pnpm install
      shell: bash
      run: pnpm install --frozen-lockfile

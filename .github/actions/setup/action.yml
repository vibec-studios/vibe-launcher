name: Setup
description: Node/pnpm, Rust, Systempakete (Linux) und alle Caches (pnpm-Store, Cargo, Tauri-Bundler-Tools) einrichten
inputs:
  cache-key:
    description: Cargo-Cache-Schlüssel (getrennt nach Profil/OS, z. B. "release-linux" oder "debug")
    required: true
  rust-targets:
    description: Zusätzliche Rust-Targets (z. B. "aarch64-apple-darwin,x86_64-apple-darwin" für macOS universal)
    required: false
    default: ""
runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@v4
      with:
        version: 11

    - uses: actions/setup-node@v4
      with:
        node-version: 24
        cache: pnpm

    - uses: dtolnay/rust-toolchain@stable
      with:
        targets: ${{ inputs.rust-targets }}

    # Tauri-Abhängigkeiten unter Linux (WebKitGTK 4.1, AppIndicator, rsvg) + Werkzeuge für AppImage/.deb
    - name: Linux-Pakete
      if: runner.os == 'Linux'
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends \
          libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev \
          build-essential curl wget file patchelf

    # target/ + ~/.cargo (Registry, Git) – nur main/Tags speichern, Branches lesen nur
    - uses: Swatinem/rust-cache@v2
      with:
        workspaces: src-tauri -> target
        shared-key: ${{ inputs.cache-key }}
        save-if: ${{ github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/') }}
        # Auch bei Fehlschlag speichern – sonst kostet ein Fehler im letzten Schritt wieder den vollen Build
        cache-on-failure: true

    # NSIS + Signier-Tools, die die Tauri-CLI beim ersten Bundle herunterlädt
    - uses: actions/cache@v4
      if: runner.os == 'Windows'
      with:
        path: ~\AppData\Local\tauri
        key: tauri-bundler-tools-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
        restore-keys: tauri-bundler-tools-${{ runner.os }}-

    # linuxdeploy/AppImage-Werkzeuge
    - uses: actions/cache@v4
      if: runner.os == 'Linux'
      with:
        path: ~/.cache/tauri
        key: tauri-bundler-tools-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
        restore-keys: tauri-bundler-tools-${{ runner.os }}-

    - name: pnpm install
      shell: bash
      run: pnpm install --frozen-lockfile
